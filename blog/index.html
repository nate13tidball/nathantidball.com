<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Blog | Nathan Tidball</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --blue: #173f8a; --blue-dark: #102e68; --ink: #17243a; --muted: #5d6c82; --line: #d6dfea; --soft-blue: #eaf0fa; --max: 1120px; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fff; font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #5886d4; outline-offset: 4px; }
    .skip { position: fixed; top: -5rem; left: 1rem; z-index: 10; padding: .7rem 1rem; background: #fff; color: var(--blue); }
    .skip:focus { top: 1rem; }
    .wrap { width: min(var(--max), calc(100% - 3rem)); margin-inline: auto; }
    .site-header { border-bottom: 1px solid var(--line); background: #fff; }
    .nav { display: flex; flex-direction: column; }
    .nav-top { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { color: var(--blue); text-decoration: none; font-size: 1.08rem; font-weight: 800; letter-spacing: -.035em; white-space: nowrap; }
    .header-contact { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: .45rem .9rem; border: 1px solid var(--blue); border-radius: 4px; background: var(--blue); color: #fff; text-decoration: none; font-size: .75rem; font-weight: 800; white-space: nowrap; }
    .header-contact:hover { background: var(--blue-dark); }
    .nav-links { min-height: 46px; display: flex; gap: clamp(.8rem, 2.4vw, 2rem); align-items: center; list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .nav-links a { text-decoration: none; color: var(--muted); font-size: .75rem; font-weight: 750; letter-spacing: .09em; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--blue); }
    main { min-height: calc(100vh - 181px); padding: clamp(5rem, 12vw, 9rem) 0; background: linear-gradient(120deg, #f5f8fc, #fff 62%, #edf2f9); }
    .eyebrow { margin: 0 0 1rem; color: var(--blue); font-size: .72rem; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--blue-dark); font-size: clamp(3.3rem, 7vw, 6.3rem); font-weight: 800; letter-spacing: -.075em; line-height: 1; }
    .empty-note { max-width: 520px; margin: 1.4rem 0 0; padding-top: 1.2rem; border-top: 2px solid #a8bddd; color: var(--muted); font-size: 1.08rem; }
    .back-link { display: inline-block; margin-top: 1.8rem; color: var(--blue); font-size: .84rem; font-weight: 800; text-decoration: none; }
    .back-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    footer { padding: 1.6rem 0; color: #718099; font-size: .78rem; }
    @media (max-width: 720px) {
      .wrap { width: min(var(--max), calc(100% - 2rem)); }
      .nav-top { min-height: 62px; gap: .5rem; }
      .brand { font-size: .96rem; }
      .header-contact { min-height: 34px; padding: .35rem .7rem; font-size: .65rem; }
      .nav-links { width: 100%; min-height: 42px; justify-content: space-between; gap: .3rem; }
      .nav-links a { font-size: .64rem; letter-spacing: .045em; }
    }
    @media (max-width: 390px) {
      .nav-top { align-items: flex-start; flex-direction: column; }
      .header-contact { width: 100%; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="nav wrap" aria-label="Main navigation">
      <div class="nav-top">
        <a class="brand" href="/">NATHAN TIDBALL</a>
        <a class="header-contact" href="/#contact">Contact ↘</a>
      </div>
      <ul class="nav-links">
        <li><a href="/#about">ABOUT</a></li>
        <li><a href="/#experience">EXPERIENCE</a></li>
        <li><a href="/#projects">PROJECTS</a></li>
        <li><a href="/blog/" aria-current="page">BLOG</a></li>
        <li><a href="/#contact">CONTACT</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <div class="wrap">
      <p class="eyebrow">Nathan Tidball / Blog</p>
      <h1>Blog.</h1>
      <p class="empty-note">No posts yet.</p>
      <a class="back-link" href="/">← Back to the homepage</a>
    </div>
  </main>
  <footer><div class="wrap">© 2026 Nathan Tidball</div></footer>
</body>
</html>
